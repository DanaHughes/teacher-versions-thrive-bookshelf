of \" + L.slides.length + (sl.steps > 1 ? \"  ·  step \" + (step + 1) + \" of \" + sl.steps : \"\");\n    bar.back.disabled = si === 0 && step === 0;\n    bar.next.disabled = si === L.slides.length - 1 && step === sl.steps - 1;\n    bar.pen.classList.toggle(\"on\", pen);\n    bar.colors.querySelectorAll(\".dot\").forEach(x => x.classList.toggle(\"on\", pen && x.dataset.c === penColor));\n    bar.stage.classList.toggle(\"pen\", pen);\n  }\n\n  /* ---------- pointer: click to advance, drag to move, or draw ---------- */\n  function toStage(ev){\n    const r = bar.stage.getBoundingClientRect();\n    return [(ev.clientX - r.left) * SW / r.width, (ev.clientY - r.top) * SH / r.height];\n  }\n  function onDown(ev){\n    if (ev.button > 0) return;\n    const p = toStage(ev);\n    if (pen) {\n      stroke = { c: penColor, pts: [p] };\n      (inkStore[key()] = inkStore[key()] || []).push(stroke);\n      bar.stage.setPointerCapture(ev.pointerId); ev.preventDefault(); return;\n    }\n    const g = ev.target.closest && ev.target.closest(\".lp-mv\");\n    drag = { g: g && !g.classList.contains(\"lp-hid\") ? g : null, start: p, moved: false,\n             base: g ? ((moveStore[key()] || {})[g.dataset.i] || [0, 0]) : [0, 0] };\n    bar.stage.setPointerCapture(ev.pointerId); ev.preventDefault();\n  }\n  function onMove(ev){\n    if (stroke) { stroke.pts.push(toStage(ev)); drawInk(); return; }\n    if (!drag) return;\n    const p = toStage(ev), dx = p[0] - drag.start[0], dy = p[1] - drag.start[1];\n    if (!drag.moved && Math.hypot(dx, dy) < 8) return;\n    drag.moved = true;\n    if (drag.g) {\n      const v = [drag.base[0] + dx, drag.base[1] + dy];\n      (moveStore[key()] = moveStore[key()] || {})[drag.g.dataset.i] = v;\n      drag.g.setAttribute(\"transform\", `translate(${v[0]} ${v[1]})`);\n    }\n  }\n  function onUp(){\n    if (stroke) { stroke = null; return; }\n    if (!drag) return;\n    const clicked = !drag.moved; drag = null;\n    if (clicked) go(1);\n  }\n  function drawInk(){\n    const c = ink.getContext(\"2d\"), k = ink.width / SW;\n    c.clearRect(0, 0, ink.width, ink.height);\n    (inkStore[key()] || []).forEach(s => {\n      c.strokeStyle = s.c; c.lineWidth = 6 * k; c.lineCap = \"round\"; c.lineJoin = \"round\";\n      c.beginPath();\n      s.pts.forEach((p, i) => i ? c.lineTo(p[0] * k, p[1] * k) : c.moveTo(p[0] * k, p[1] * k));\n      if (s.pts.length === 1) c.lineTo(s.pts[0][0] * k + 0.1, s.pts[0][1] * k);\n      c.stroke();\n    });\n  }\n\n  /* ---------- the notes window ---------- */\n  const NOTES_CSS = `body{margin:0;font:17px/1.45 Andika,Verdana,sans-serif;background:#f4f2e9;color:#22301d}\n    header{background:#304c29;color:#fff;padding:14px 18px}\n    header h1{margin:0;font:700 19px/1.25 Lora,Georgia,serif}\n    header p{margin:4px 0 0;font-size:14px;color:#cbe08f}\n    .warn{background:#fbf1dc;border-bottom:1px solid #e7d3a6;padding:9px 18px;font-size:14px;color:#5b3f0b}\n    main{padding:14px 18px 110px}\n    h2{font:700 15px/1.2 Barlow,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#45852b;margin:16px 0 6px}\n    .now{background:#fff;border:2px solid #45852b;border-radius:12px;padding:10px 14px}\n    .now li,.next li{margin:4px 0}\n    .next{color:#6b6457;border:1px dashed #c9c1a8;border-radius:12px;padding:8px 14px}\n    ul{margin:0;padding-left:20px}\n    .slides{display:flex;flex-wrap:wrap;gap:6px}\n    .slides button{font:600 13px Barlow,Arial,sans-serif;border:1px solid #c9c1a8;background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}\n    .slides button.on{background:#304c29;color:#fff;border-color:#304c29}\n    nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 18px;background:#e9e6da;border-top:1px solid #d6d0bd}\n    nav button{flex:1;font:700 18px Barlow,Arial,sans-serif;padding:14px;border-radius:12px;border:2px solid #304c29;background:#fff;color:#304c29;cursor:pointer}\n    nav button.primary{background:#304c29;color:#fff}`;\n  function openNotes(){\n    if (notesWin && !notesWin.closed) { notesWin.focus(); syncNotes(); return; }\n    notesWin = window.open(\"\", \"thrive-lesson-notes\", \"width=560,height=860\");\n    if (!notesWin) { alert(\"Your browser blocked the notes window. Allow pop-ups for this page, then tap Notes again.\"); return; }\n    const d = notesWin.document;\n    d.open();\n    d.write(`<!doctype html><html><head><meta charset=\"utf-8\"><title>Teacher notes<\/title><style>${NOTES_CSS}<\/style><\/head><body>\n      <header><h1 id=\"t\"><\/h1><p id=\"c\"><\/p><\/header>\n      <div class=\"warn\">Share only the flipbook tab (Meet: Present, A tab) or the flipbook window (Zoom). This notes window stays private.<\/div>\n      <main><h2>Now<\/h2><div class=\"now\" id=\"now\"><\/div><h2>After the next click<\/h2><div class=\"next\" id=\"nx\"><\/div>\n      <h2>Jump to a slide<\/h2><div class=\"slides\" id=\"sl\"><\/div><\/main>\n      <nav><button id=\"bk\">&#8249; Back<\/button><button id=\"nt\" class=\"primary\">Next &#8250;<\/button><\/nav><\/body><\/html>`);\n    d.close();\n    d.getElementById(\"bk\").onclick = () => go(-1);\n    d.getElementById(\"nt\").onclick = () => go(1);\n    notesWin.addEventListener(\"keydown\", ev => {\n      if ([\"ArrowRight\", \"PageDown\", \" \"].includes(ev.key)) { ev.preventDefault(); go(1); }\n      if ([\"ArrowLeft\", \"PageUp\"].includes(ev.key)) { ev.preventDefault(); go(-1); }\n    });\n    syncNotes();\n  }\n  function list(items){ return items && items.length ? \"<ul>\" + items.map(t => \"<li>\" + esc(t) + \"<\/li>\").join(\"\") + \"<\/ul>\" : \"<p>(Nothing new: click to go on.)<\/p>\"; }\n  function esc(t){ return String(t).replace(/[&<>]/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\" }[c])); }\n  function syncNotes(){\n    if (!notesWin || notesWin.closed || !L) return;\n    const d = notesWin.document, sl = L.slides[si];\n    if (!d.getElementById(\"t\")) return;\n    d.getElementById(\"t\").textContent = (L.label || \"Week \" + L.week) + \": \" + L.topic;\n    d.getElementById(\"c\").textContent = \"Slide \" + (si + 1) + \" of \" + L.slides.length + \": \" + sl.title + (sl.steps > 1 ? \"  ·  step \" + (step + 1) + \" of \" + sl.steps : \"\");\n    d.getElementById(\"now\").innerHTML = list(sl.notes[step]);\n    let nxt;\n    if (step < sl.steps - 1) nxt = sl.notes[step + 1];\n    else if (si < L.slides.length - 1) nxt = [\"New slide: \" + L.slides[si + 1].title].concat(L.slides[si + 1].notes[0] || []);\n    else nxt = [\"This is the last slide.\"];\n    d.getElementById(\"nx\").innerHTML = list(nxt);\n    const box = d.getElementById(\"sl\"); box.innerHTML = \"\";\n    L.slides.forEach((s, i) => {\n      const x = d.createElement(\"button\"); x.textContent = (i + 1) + \". \" + s.title;\n      if (i === si) x.className = \"on\";\n      x.onclick = () => jump(i); box.append(x);\n    });\n  }\n\n  /* ---------- open and close ---------- */\n  function onKey(ev){\n    if (!root || root.hidden) return;\n    const k = ev.key;\n    if ([\"ArrowRight\", \"PageDown\", \" \", \"Enter\"].includes(k) && !(ev.target && ev.target.closest && ev.target.closest(\".lp-bar\"))) { ev.preventDefault(); ev.stopImmediatePropagation(); go(1); }\n    else if ([\"ArrowLeft\", \"PageUp\"].includes(k)) { ev.preventDefault(); ev.stopImmediatePropagation(); go(-1); }\n    else if (k === \"Escape\") { ev.preventDefault(); ev.stopImmediatePropagation(); close(); }\n    else ev.stopImmediatePropagation();\n  }\n  function open(week){\n    const lesson = LESSON2[String(week)];\n    if (!lesson) return false;\n    if (!root) build();\n    L = lesson; si = 0; step = 0; pen = false;\n    root.hidden = false; document.documentElement.classList.add(\"lp-open\");\n    if (!keyFn) { keyFn = onKey; window.addEventListener(\"keydown\", keyFn, true); }\n    render();\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!root.hidden) render(); });\n    return true;\n  }\n  function close(){\n    if (!root) return;\n    root.hidden = true; document.documentElement.classList.remove(\"lp-open\");\n    if (notesWin && !notesWin.closed) notesWin.close();\n    notesWin = null;\n  }\n  return { open, close, next: () => go(1), back: () => go(-1), jump, state: () => ({ si, step, week: L && L.week }) };\n})();\nfunction openLesson(week){ return LP.open(week); }", "playerCss": "\n/* ---- lesson player (teacher book) ---- */\nhtml.lp-open, html.lp-open body{overflow:hidden}\n.lp-root{position:fixed;inset:0;z-index:9000;background:#e9e6da;display:flex;flex-direction:column}\n.lp-root[hidden]{display:none!important}\n.lp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#f4f2e9;border-bottom:1px solid #d6d0bd}\n.lp-title{font:700 17px/1.2 Lora,Georgia,serif;color:#304c29;margin-right:6px;max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.lp-count{font:600 13px Barlow,Arial,sans-serif;color:#6b6457;margin-right:auto}\n.lp-btn{font:700 15px Barlow,Arial,sans-serif;min-height:40px;padding:8px 14px;border-radius:10px;border:2px solid #304c29;background:#fff;color:#304c29;cursor:pointer}\n.lp-btn:disabled{opacity:.4;cursor:default}\n.lp-btn.primary{background:#304c29;color:#fff}\n.lp-btn.on{background:#e4eadd}\n.lp-btn.notes{border-color:#9c6a12;color:#7a5410}\n.lp-btn.close{font-size:22px;padding:4px 12px;line-height:1}\n.lp-colors{display:flex;gap:6px}\n.lp-btn.dot{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9c1a8}\n.lp-btn.dot.on{box-shadow:0 0 0 3px #304c29}\n.lp-stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}\n.lp-stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(40,50,30,.18);background:#f4f2e9;touch-action:none;cursor:pointer;user-select:none}\n.lp-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}\n.lp-stage .lp-ink{position:absolute;inset:0;pointer-events:none}\n.lp-stage.pen{cursor:crosshair}\n.lp-stage .lp-mv{cursor:grab}\n.lp-stage.pen .lp-mv{cursor:crosshair}\n.lp-stage [data-s]{transition:opacity .35s ease}\n.lp-stage .lp-hid{opacity:0;pointer-events:none}\n@media (prefers-reduced-motion: reduce){.lp-stage [data-s]{transition:none}}\n@media print{.lp-root{display:none!important}}\n"}</script>
<script>
/* Turns the live STUDENT book into the TEACHER book, in the browser.
   h = the student book's HTML, exactly as published. PACK = the teacher-only parts.
   Every step is optional: if the student book changes shape and a step no longer
   fits, that one extra is skipped and the book still opens (see `skipped`). */
function composeTeacher(h, PACK){
  const skipped = [];
  const put = (find, add, before, what) => {
    const i = h.indexOf(find);
    if (i < 0) { skipped.push(what); return; }
    const at = before ? i : i + find.length;
    h = h.slice(0, at) + add + h.slice(at);
  };
  const safe = s => s.replace(/<\/(script)/gi, "<\\/$1");
  const json = v => safe(JSON.stringify(v));

  // 1. this is the teacher book: its own name, its own saved work, never locked
  put("<head>", "<script>window.THRIVE_TEACHER=true;<\/script>", false, "teacher flag");
  h = h.replace(/<title>[^<]*<\/title>/, () => "<title>" + PACK.book.title + "</title>");
  let named = false;
  h = h.replace(/^const BOOK = \{.*\};?[ \t]*$/m, () => { named = true; return "const BOOK = " + json(PACK.book) + ";"; });
  if (!named) skipped.push("book name");
  h = h.replace(/"eyebrow": "(?!Teacher Book)/, () => '"eyebrow": "Teacher Book · ');

  // 2. the Lesson button opens the click-through lesson for that week
  const oldBtn = 'if (plan) {\n    const lesson = btn("bigbtn lesson", undefined, () => turnTo(2));';
  if (h.indexOf(oldBtn) >= 0) {
    h = h.replace(oldBtn, () => 'if (typeof LESSON2 !== "undefined" && LESSON2[String(page.week)]) {\n' +
      '    const lesson = btn("bigbtn lesson", undefined, () => openLesson(page.week));');
  } else if (h.indexOf("const player = typeof LESSON2") < 0) skipped.push("lesson button");

  // 3. the lessons. They are filed by topic and handed to whichever week has that
  //    topic in the student book today, so they follow the student book's order.
  const lessons =
    "\n/* teacher pack: lessons follow their topic, so they stay with the student book's order */\n" +
    "const BSG = " + json(PACK.bsg) + ";\n" +
    "const LESSON_BANK = " + json(PACK.bank) + ";\n" +
    "const LESSON2 = {};\n" +
    "ORDER.forEach(id => {\n" +
    "  const p = DATA[id].page, L = LESSON_BANK[p.topic];\n" +
    "  if (!L) return;\n" +
    "  const label = p.label || (p.bonus ? \"Bonus lesson \" + p.bonus : (p.review ? \"Review \\u00b7 Week \" : \"Week \") + p.week);\n" +
    "  const copy = JSON.parse(JSON.stringify(L).split(\"Week \" + L.week + \": \").join(label + \": \"));\n" +
    "  copy.week = p.week; copy.label = label;\n" +
    "  LESSON2[String(p.week)] = copy;\n" +
    "});\n" + PACK.playerJs + "\n";
  put("\nconst LESSONS = ", lessons, true, "lessons");
  let art = false;
  h = h.replace(/^const LESSONS = .*$/m, m => { art = true; return m + "\nObject.assign(LESSONS.art, " + json(PACK.art) + ");"; });
  if (!art) skipped.push("lesson art");

  // 4. styles for the lesson player and the Google Slides list
  const css = PACK.playerCss +
    "\n.slides-note{margin:0;padding:10px 18px 4px;font:400 15px var(--font-read);color:var(--ink-2)}" +
    "\n.slides-row{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--rule-soft)}" +
    "\n.slides-row .title{flex:1 1 auto;font:600 16px var(--font-ui);color:var(--ink)}" +
    "\n.slides-row .title .meta{display:block;font:400 13px var(--font-ui);color:var(--ink-3)}" +
    "\n.slides-row a.btn{text-decoration:none;white-space:nowrap}\n";
  put("</style>", css, true, "styles");

  // 5. the Google Slides button (the decks live in Google Slides so teachers can edit a copy)
  const slides = "<script>\n(function(){\n" +
    "  const DECKS = " + json(PACK.slides) + ";\n" +
    "  if (!DECKS.length || typeof btn !== 'function' || typeof el !== 'function') return;\n" +
    "  function openSlides(){\n" +
    "    const host = document.getElementById('drawerHost');\n" +
    "    const scrim = el('div', 'scrim'), drawer = el('div', 'drawer');\n" +
    "    drawer.setAttribute('role', 'dialog'); drawer.setAttribute('aria-modal', 'true'); drawer.setAttribute('aria-label', 'Google Slides lessons');\n" +
    "    const head = el('div', 'drawer-head');\n" +
    "    const closer = btn('closer', '\\u00d7', closeDrawer); closer.setAttribute('aria-label', 'Close');\n" +
    "    head.append(mascot('waving', 'tiny'), Object.assign(el('h2'), { textContent: 'Google Slides lessons' }), closer);\n" +
    "    const list = el('div', 'toc');\n" +
    "    DECKS.forEach(d => {\n" +
    "      const row = el('div', 'slides-row'), title = el('span', 'title', d.title);\n" +
    "      title.append(el('span', 'meta', d.week));\n" +
    "      const copy = el('a', 'btn btn-primary', 'Make my copy');\n" +
    "      copy.href = 'https://docs.google.com/presentation/d/' + d.id + '/copy'; copy.target = '_blank'; copy.rel = 'noopener';\n" +
    "      const view = el('a', 'btn btn-quiet', 'View');\n" +
    "      view.href = 'https://docs.google.com/presentation/d/' + d.id + '/edit'; view.target = '_blank'; view.rel = 'noopener';\n" +
    "      row.append(title, copy, view); list.append(row);\n" +
    "    });\n" +
    "    drawer.append(head, el('p', 'slides-note', 'Make your own copy before class, then edit it with your information.'), list);\n" +
    "    scrim.append(drawer);\n" +
    "    scrim.addEventListener('click', ev => { if (ev.target === scrim) closeDrawer(); });\n" +
    "    document.addEventListener('keydown', escClose);\n" +
    "    host.append(scrim); closer.focus();\n" +
    "  }\n" +
    "  const bar = document.getElementById('masthead');\n" +
    "  function addChip(){\n" +
    "    if (!bar || bar.querySelector('.slides-chip') || !bar.lastElementChild) return;\n" +
    "    bar.insertBefore(btn('chip-btn slides-chip', 'Google Slides', openSlides), bar.lastElementChild);\n" +
    "  }\n" +
    "  addChip();\n" +
    "  if (bar) new MutationObserver(addChip).observe(bar, { childList: true });\n" +
    "})();\n<\/script>";
  const end = h.lastIndexOf("</body>");
  if (end < 0) skipped.push("slides button"); else h = h.slice(0, end) + slides + h.slice(end);

  return { html: h, skipped };
}

(function(){
  const PACK = JSON.parse(document.getElementById("pack").textContent);
  const msg = document.getElementById("msg"), card = document.getElementById("card");
  function failed(){
    msg.textContent = "The teacher book could not open the student book. Check your internet connection, then try again.";
    const again = document.createElement("button");
    again.type = "button"; again.textContent = "Try again";
    again.addEventListener("click", () => location.reload());
    card.append(again);
  }
  fetch(PACK.student, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const made = composeTeacher(text, PACK);
      if (made.skipped.length) console.warn("Teacher book: skipped " + made.skipped.join(", "));
      document.open(); document.write(made.html); document.close();
    })
    .catch(err => { console.warn("Teacher book could not load", err); failed(); });
})();
</script>
